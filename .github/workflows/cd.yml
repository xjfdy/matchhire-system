name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - job-service
          - application-service
          - api-gateway
          - matching-service
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify minikube is running
        shell: powershell
        run: minikube status

      - name: Build ${{ matrix.service }} image into minikube
        shell: powershell
        run: |
          minikube -p minikube docker-env --shell powershell | Invoke-Expression
          docker build -t ${{ matrix.service }}:local ./${{ matrix.service }}

      - name: Deploy ${{ matrix.service }} to Kubernetes
        shell: powershell
        run: kubectl apply -f ${{ matrix.service }}/k8s/

      - name: Roll out ${{ matrix.service }}
        shell: powershell
        run: kubectl rollout restart deployment/${{ matrix.service }}
